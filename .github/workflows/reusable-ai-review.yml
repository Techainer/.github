# AI code review gate — chấm diff bằng LLM (OpenAI-compatible) theo rules THS.
# Logic nằm ở .github/scripts/ai_review.py (repo này public → job tự checkout script).
# CHỈ review khi đáng tiền (chốt 27/10, sau vụ getnexai 402):
#   - pull_request (không draft) → comment 1 lần/PR (sửa tại chỗ), FAIL = chặn merge nếu bật protection.
#   - push vào nhánh trong `review_branches` (staging/prod/master) → comment lên commit, FAIL = commit đỏ.
#     SHA đã review ở PR đã merge / đã có comment review → DÙNG LẠI verdict, không gọi LLM.
#   - mọi event khác (push develop/feature, workflow_dispatch…) → job vẫn SUCCESS nhưng không gọi LLM.
#     Skip ở STEP chứ không ở `if:` của job: ci-cd.yml có `build-develop: needs: review` không kèm
#     !cancelled() → job skipped sẽ kéo build develop skip theo.
# profile: code (mặc định, app repo) | deploy (repo deployment: kustomize+kubeconform cứng, commit chỉ đổi tag = PASS).
# LLM lỗi → fail-open CÓ cảnh báo (::warning + comment "KHÔNG CHẠY ĐƯỢC"), không chặn build.
# Caller truyền tường minh 2 secret (least-privilege): OPENAI_API_KEY, OPENAI_BASE_URL.
name: reusable-ai-review
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: code
      # Tên trung tính; LiteLLM map alias → model thật (đổi backend không phải sửa CI).
      model:
        type: string
        default: ai-review
      # Tham số phụ gộp vào body request (JSON). Mặc định tắt thinking của Qwen3: review cần JSON gọn,
      # thinking làm chậm gấp nhiều lần và dễ chạm timeout 100s của Cloudflare.
      llm_extra_body:
        type: string
        default: '{"chat_template_kwargs":{"enable_thinking":false}}'
      review_branches:
        type: string
        default: production,production-staging,staging,master,main
      # Job chỉ gọi HTTP + chạy python, KHÔNG đụng docker → không ghim box build.
      runner:
        type: string
        default: self-hosted
    secrets:
      OPENAI_API_KEY:
        required: false   # thiếu → fail-open có cảnh báo (không chặn build oan)
      OPENAI_BASE_URL:
        required: false
jobs:
  ai-review:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner }}
    # PR: push mới huỷ review cũ. Push: group theo ref+SHA → standalone + build-gate cùng SHA chạy LẦN LƯỢT,
    # lần sau thấy comment của lần trước và dùng lại verdict. KHÔNG huỷ run push (notify-push đọc verdict).
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write        # push: comment lên commit
      pull-requests: write    # PR: comment lên PR
    steps:
      - name: Có cần review không?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BRANCHES: ${{ inputs.review_branches }}
        run: |
          run=false
          case "$EVENT" in
            pull_request) run=true ;;
            push) case ",${BRANCHES// /}," in *",$BRANCH,"*) run=true ;; esac ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "::notice title=Bỏ qua AI review::$EVENT trên '$BRANCH' — chỉ review PR và push vào: $BRANCHES"
      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'
        with:
          repository: Techainer/.github
          ref: main
          path: .ai-review-tool
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Đảm bảo có python3 (runner trần chưa chắc có)
        id: py
        if: steps.decide.outputs.run == 'true'
        run: command -v python3 >/dev/null || echo "need=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true' && steps.py.outputs.need == '1'
        with:
          python-version: "3.12"
      - name: Cài kustomize + kubeconform (validate config cứng — chỉ profile deploy)
        if: steps.decide.outputs.run == 'true' && inputs.profile == 'deploy'
        run: |
          set -euo pipefail
          # RUNNER_TEMP + GITHUB_PATH thay vì sudo: không phải self-hosted nào cũng có sudo không mật khẩu.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: AI review
        if: steps.decide.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL: ${{ inputs.model }}
          LLM_EXTRA_BODY: ${{ inputs.llm_extra_body }}
          PROFILE: ${{ inputs.profile }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 .ai-review-tool/.github/scripts/ai_review.py
