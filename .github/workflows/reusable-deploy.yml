# Reusable deploy: Telegram inline Approve/Reject gate (allowlist theo Telegram-id, không cần GitHub acct,
# không cần gói trả phí) -> ghi tag SẠCH vào deploy repo (tự migrate name env-baked) -> report. ArgoCD sync MANUAL.
name: reusable-deploy
on:
  workflow_call:
    inputs:
      environment:      { required: true,  type: string }
      deploy_repo:      { required: true,  type: string }
      deploy_ref:       { required: false, type: string, default: 'master' }
      image:            { required: true,  type: string }
      tag:              { required: true,  type: string }
      kustomize_path:   { required: true,  type: string }
      approval:         { required: false, type: string, default: 'true' }   # 'false' = bỏ gate (dev)
      approval_timeout: { required: false, type: number, default: 1200 }
    secrets:
      DEPLOY_REPO_SSH_KEY: { required: true }
      TELEGRAM_BOT_TOKEN:  { required: false }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve review link (PR nếu có, else commit)
        id: link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ github.sha }}
          SERVER:   ${{ github.server_url }}
        run: |
          RESP="$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$SHA/pulls" 2>/dev/null || echo '[]')"
          URL="$(printf '%s' "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);pr=d[0] if isinstance(d,list) and d else None;print(pr['html_url'] if pr else '')" 2>/dev/null || true)"
          TITLE="$(printf '%s' "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);pr=d[0] if isinstance(d,list) and d else None;print(('PR #%d: %s (by @%s)'%(pr['number'],pr['title'],pr['user']['login'])) if pr else '')" 2>/dev/null || true)"
          [ -z "$URL" ] && URL="$SERVER/$REPO/commit/${SHA:0:7}"
          { echo "review_url=$URL"; echo "review_title=$TITLE"; } >> "$GITHUB_OUTPUT"
      - name: Fetch gate script
        uses: actions/checkout@v4
        with: { repository: Techainer/.github, ref: main, path: _ci }
      - name: Telegram Approve/Reject gate
        env:
          BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:     ${{ vars[format('TELEGRAM_CHAT_ID_{0}', inputs.environment)] }}
          APPROVERS:   ${{ vars[format('TELEGRAM_APPROVERS_{0}', inputs.environment)] }}
          APPROVAL:    ${{ (inputs.environment == 'production') && 'true' || 'false' }}   # gate CHỈ prod; staging auto
          TIMEOUT:     ${{ inputs.approval_timeout }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE:       ${{ inputs.image }}
          TAG:         ${{ inputs.tag }}
          ACTOR:       ${{ github.actor }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_URL:  ${{ steps.link.outputs.review_url }}
          REVIEW_TITLE: ${{ steps.link.outputs.review_title }}
          RUN_ID:      ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 _ci/scripts/telegram-gate.py
  promote:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.deploy_repo }}
          ref: ${{ inputs.deploy_ref }}
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          fetch-depth: 0
      - name: Ghi tag vào overlay (name sạch, tự migrate)
        id: write
        run: |
          set -euo pipefail
          cd "${{ inputs.kustomize_path }}"
          CUR="$(awk '/^images:/{f=1} f&&/name:/{sub(/.*name:[[:space:]]*/,"");gsub(/"/,"");print;exit}' kustomization.yaml)"
          OLD="$(awk '/^images:/{f=1} f&&/newTag:/{sub(/.*newTag:[[:space:]]*/,"");gsub(/"/,"");print;exit}' kustomization.yaml)"
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image "${CUR}=${{ inputs.image }}:${{ inputs.tag }}"
          rm -f kustomize
          echo "old=${OLD:-none}" >> "$GITHUB_OUTPUT"
      - name: Commit + push tag (rebase-retry cho ghi song song)
        run: |
          git config user.name  "techainer-ci"
          git config user.email "ci@techainer.com"
          git commit -am "deploy(${{ inputs.environment }}): ${{ inputs.image }}:${{ inputs.tag }}" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git push origin "HEAD:${{ inputs.deploy_ref }}" && { echo pushed; exit 0; }
            echo "push bị từ chối (ghi song song), rebase & thử lại ($i)"
            git fetch -q origin "${{ inputs.deploy_ref }}"
            git rebase "origin/${{ inputs.deploy_ref }}" || git rebase --abort
            sleep $(( (RANDOM % 6) + 2 ))
          done
          echo "::error::push thất bại sau 6 lần"; exit 1
      - name: Telegram — đã ghi tag (chờ ArgoCD sync)
        if: ${{ always() }}
        env:
          T:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ vars[format('TELEGRAM_CHAT_ID_{0}', inputs.environment)] }}
        run: |
          [ -z "$T" ] || [ -z "$CHAT" ] && exit 0
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MSG="$(printf '🚀 *%s* tag ghi xong\n%s:%s (cũ `%s`)\n→ ArgoCD sync (manual)\n%s' '${{ inputs.environment }}' '${{ inputs.image }}' '${{ inputs.tag }}' '${{ steps.write.outputs.old }}' "$URL")"
          curl -s "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$MSG" -d parse_mode=Markdown >/dev/null || true
