# Reusable deploy: Telegram inline Approve/Reject gate (allowlist theo Telegram-id, không cần GitHub acct,
# không cần gói trả phí) -> ghi tag SẠCH vào deploy repo (tự migrate name env-baked) -> report. ArgoCD sync MANUAL.
name: reusable-deploy
on:
  workflow_call:
    inputs:
      environment:      { required: true,  type: string }
      deploy_repo:      { required: true,  type: string }
      deploy_ref:       { required: false, type: string, default: 'master' }
      image:            { required: true,  type: string }
      tag:              { required: true,  type: string }
      kustomize_path:   { required: true,  type: string }
      approval:         { required: false, type: string, default: 'true' }   # 'false' = bỏ gate (dev)
      approval_timeout: { required: false, type: number, default: 1200 }
      # promote chỉ checkout deploy repo + kustomize edit + git push + 1 curl Telegram — KHÔNG đụng
      # docker daemon nên không cần ghim đúng box build. Xem note runs-on bên dưới.
      runner:           { required: false, type: string, default: 'self-hosted' }
    secrets:
      DEPLOY_REPO_TOKEN:   { required: true }    # PAT (HTTPS) — self-hosted sau proxy chặn SSH:22 nên ssh-key vô hiệu
      DEPLOY_REPO_SSH_KEY: { required: false }   # legacy (ubuntu-latest), giữ để không vỡ caller cũ
      TELEGRAM_BOT_TOKEN:  { required: false }
jobs:
  # GATE getUpdates ĐÃ BỎ (14/7 — WS4): THS Bot push-gate (cron deploy-watch) phát hiện commit đổi tag
  # trên master rồi hỏi Approve/Reject và tự sync. Không còn long-poll getUpdates ở CI → HẾT 409.
  # CI giờ chỉ ghi tag SẠCH vào master (CHƯA lên cụm — ArgoCD manual). Duyệt + sync do THS Bot lo.
  promote:
    # 'self-hosted' = label tự động mọi runner self-hosted đều có → hiện vẫn về techainer-gkebooks-1,
    # nhưng thêm runner nhẹ vào pool thì promote tự chảy sang runner rảnh thay vì chờ build 40 phút.
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.deploy_repo }}
          ref: ${{ inputs.deploy_ref }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}   # HTTPS+PAT: chạy được trên self-hosted (box chặn SSH:22)
          fetch-depth: 0
      - name: Ghi tag vào overlay (name sạch, tự migrate)
        id: write
        run: |
          set -euo pipefail
          cd "${{ inputs.kustomize_path }}"
          CUR="$(awk '/^images:/{f=1} f&&/name:/{sub(/.*name:[[:space:]]*/,"");gsub(/"/,"");print;exit}' kustomization.yaml)"
          OLD="$(awk '/^images:/{f=1} f&&/newTag:/{sub(/.*newTag:[[:space:]]*/,"");gsub(/"/,"");print;exit}' kustomization.yaml)"
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image "${CUR}=${{ inputs.image }}:${{ inputs.tag }}"
          rm -f kustomize
          echo "old=${OLD:-none}" >> "$GITHUB_OUTPUT"
      - name: Commit + push tag (rebase-retry cho ghi song song)
        run: |
          git config user.name  "techainer-ci"
          git config user.email "ci@techainer.com"
          git commit -am "deploy(${{ inputs.environment }}): ${{ inputs.image }}:${{ inputs.tag }}" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git push origin "HEAD:${{ inputs.deploy_ref }}" && { echo pushed; exit 0; }
            echo "push bị từ chối (ghi song song), rebase & thử lại ($i)"
            git fetch -q origin "${{ inputs.deploy_ref }}"
            git rebase "origin/${{ inputs.deploy_ref }}" || git rebase --abort
            sleep $(( (RANDOM % 6) + 2 ))
          done
          echo "::error::push thất bại sau 6 lần"; exit 1
      - name: Telegram — CHỜ DUYỆT (reply deploy để lên)
        if: ${{ success() }}   # chỉ báo khi ghi+push tag THÀNH CÔNG (tránh "tag ghi xong" giả khi step lỗi)
        env:
          T:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # CHAT tra theo môi trường bằng REF TĨNH ĐÚNG HOA — KHÔNG dùng vars[format(...lowercase)]:
          # dynamic bracket-lookup key thường CASE-SENSITIVE, key 'TELEGRAM_CHAT_ID_production' KHÔNG khớp var HOA
          # 'TELEGRAM_CHAT_ID_PRODUCTION' → CHAT rỗng → NUỐT card MỌI deploy staging/prod. Chọn theo ENVN trong bash.
          CHAT_PRODUCTION: ${{ vars.TELEGRAM_CHAT_ID_PRODUCTION }}
          CHAT_STAGING:    ${{ vars.TELEGRAM_CHAT_ID_STAGING }}
          CHAT_FALLBACK:   ${{ vars.TELEGRAM_CHAT_ID }}
          ENVN:  ${{ inputs.environment }}
          IMAGE: ${{ inputs.image }}
          TAG:   ${{ inputs.tag }}
          OLD:   ${{ steps.write.outputs.old }}
          KPATH: ${{ inputs.kustomize_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ENVN" in production) CHAT="$CHAT_PRODUCTION";; staging) CHAT="$CHAT_STAGING";; *) CHAT="";; esac
          [ -z "$CHAT" ] && CHAT="$CHAT_FALLBACK"
          echo "notify-check: T=$([ -n "$T" ] && echo set || echo EMPTY) CHAT=$([ -n "$CHAT" ] && echo set || echo EMPTY) env=$ENVN"
          { [ -z "$T" ] || [ -z "$CHAT" ]; } && { echo "thiếu T/CHAT → KHÔNG gửi card (kiểm secret TELEGRAM_BOT_TOKEN + var TELEGRAM_CHAT_ID_<ENV>)"; exit 0; }
          # tên app dễ đọc (bỏ registry + prefix/suffix chuẩn) — chỉ để hiển thị
          APP="$(printf '%s' "$IMAGE" | sed -E 's#^.*/##; s/-frontend$//; s/^prj-(ths|gkebook)-//; s/^prj-//')"
          # env → nhãn tiếng người
          case "$ENVN" in production) LBL='🔴 PRODUCTION';; staging) LBL='🟡 production-staging';; *) LBL="$ENVN";; esac
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # map kustomize_path -> tên app ArgoCD (cho nút callback IN-PLACE). basename = thư mục app cuối path.
          ARGOAPP=""
          case "$KPATH" in
            cloud/k8s/main/*)     ARGOAPP="aks-prod-$(basename "$KPATH")" ;;
            staging/cloud/main/*) ARGOAPP="aks-staging-$(basename "$KPATH")" ;;
            staging/local/main/*) ARGOAPP="onprem-staging-$(basename "$KPATH")" ;;
            k8s/main/*)           ARGOAPP="onprem-prod-$(basename "$KPATH")" ;;
          esac
          # Chi tiết ĐỂ DUYỆT CÓ CƠ SỞ: commit đổi gì + files + tóm tắt AI review (lấy từ app repo, github.sha).
          CMSG="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message' 2>/dev/null | head -1)"
          [ -z "$CMSG" ] && CMSG="(commit $GITHUB_SHA)"
          FILES="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null | grep -vE '^\.github/' | head -8 | sed 's/^/• /')"
          [ -z "$FILES" ] && FILES="(không lấy được danh sách file)"
          REVIEW="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --jq 'map(select(.body|contains("AI Review")))|last.body // ""' 2>/dev/null | sed -e 's/^#\{1,\} *//' -e 's/\*\*//g' -e 's/`//g' | sed -n '1,12p')"
          [ -z "$REVIEW" ] && REVIEW="(chưa có nội dung review — xem CI run)"
          MSG="$(printf '🔔 CHỜ DUYỆT · %s · %s\n🏷️ %s → %s\n📝 %s\n\n📄 Files đổi:\n%s\n\n━━━ 🤖 AI REVIEW ━━━\n%s\n\n👉 Bấm nút bên dưới để Duyệt (sync) hoặc Từ chối.' "$LBL" "$APP" "${OLD:-none}" "$TAG" "$CMSG" "$FILES" "$REVIEW")"
          # Nút callback IN-PLACE: tick app + Sync/Từ chối (gate xử). Có ARGOAPP thì hiện; không thì chỉ link.
          if [ -n "$ARGOAPP" ]; then
            KB="$(printf '{"inline_keyboard":[[{"text":"☑ %s","callback_data":"dg:t:0"}],[{"text":"✅ Sync đã chọn","callback_data":"dg:go"},{"text":"❌ Từ chối","callback_data":"dg:no"}],[{"text":"🔎 CI run","url":"%s"},{"text":"📊 ArgoCD","url":"https://argocd.truonghocsoquocgia.vn/applications"}]]}' "$ARGOAPP" "$URL")"
          else
            KB="$(printf '{"inline_keyboard":[[{"text":"🔎 CI run","url":"%s"},{"text":"📊 ArgoCD","url":"https://argocd.truonghocsoquocgia.vn/applications"}]]}' "$URL")"
          fi
          # KHÔNG `|| true`: tới đây tag ĐÃ push. Nuốt lỗi = tag lên master mà KHÔNG ai nhận card duyệt —
          # đúng kiểu im lặng đã dính 27/07. Từ khi runs-on thành input, job có thể rơi vào runner chưa được
          # squid cho phép ra api.telegram.org, nên phải kêu to. Retry 3 lần rồi mới đỏ.
          SENT=0
          for i in 1 2 3; do
            CODE="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/tg.json" -w '%{http_code}' "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$MSG" --data-urlencode "reply_markup=$KB" --data-urlencode "disable_web_page_preview=true" || echo 000)"
            [ "$CODE" = "200" ] && { SENT=1; break; }
            echo "gửi Telegram lỗi (HTTP $CODE, lần $i): $(head -c 300 "$RUNNER_TEMP/tg.json" 2>/dev/null)"
            sleep 3
          done
          [ "$SENT" = "1" ] || { echo "::error::Tag ĐÃ push nhưng KHÔNG gửi được card CHỜ DUYỆT (runner ra được api.telegram.org không?) — phải duyệt tay"; exit 1; }
          echo "đã gửi card CHỜ DUYỆT"
