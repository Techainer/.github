# Reusable build: build + push image theo chuẩn DUY NHẤT techainer1t/<app>:<branch>-<sha7>
# (env nằm ở branch/tag, KHÔNG nhét vào tên image). Hỗ trợ self-hosted runner + build-time .env
# (frontend Next.js bake .env lúc build qua --secret id=env_file). Gọi bằng `uses:` + secrets: inherit.
name: reusable-build
on:
  workflow_call:
    inputs:
      image:        { required: true,  type: string }   # techainer1t/prj-ths-question-bank-frontend (KHÔNG kèm tag)
      runner:       { required: false, type: string, default: 'ubuntu-latest' }
      dockerfile:   { required: false, type: string, default: 'Dockerfile' }
      context:      { required: false, type: string, default: '.' }
      env_file_src: { required: false, type: string, default: '' }   # path trên runner -> cp vào .env (self-hosted)
      build_env:    { required: false, type: string, default: '' }   # --build-arg ENV=
      submodules:   { required: false, type: string, default: 'false' }  # 'recursive' để clone submodule (vd face-engine)
    secrets:
      DOCKER_HUB_USERNAME: { required: false }
      DOCKER_HUB_PASSWORD: { required: false }
      GH_PAT:              { required: false }   # token đọc submodule private (khi submodules != false)
      OPENAI_API_KEY:      { required: false }   # gate AI-review trước build (rỗng = fail-open, vẫn build)
      OPENAI_BASE_URL:     { required: false }
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}
      image:
        value: ${{ inputs.image }}
jobs:
  # GATE: AI review CODE trước — FAIL (bug/security rõ) → job này fail → build bị SKIP → không deploy.
  # Secret OPENAI_* chảy vào qua `secrets: inherit` ở deploy.yml. Thiếu key → reusable-ai-review fail-open (không chặn).
  review:
    # CHỈ gate code MỚI (push). workflow_dispatch = redeploy code đã review lúc push → KHÔNG re-review (tránh chặn oan bởi commit cũ).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: Techainer/.github/.github/workflows/reusable-ai-review.yml@main
    with:
      profile: code
    secrets:
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  build:
    needs: review
    # Build khi review PASS (push) HOẶC review được skip (dispatch = redeploy). FAIL review → build KHÔNG chạy.
    if: ${{ !cancelled() && (needs.review.result == 'success' || needs.review.result == 'skipped') }}
    runs-on: ${{ inputs.runner }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: false
      - name: Init submodules qua GH_PAT (rewrite ssh/https -> token)
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git submodule sync --recursive || true
          # Submodule to (tldraw-fork 653MB) clone FULL history tốn ~38 phút trên box — 88% thời gian
          # của cả job build. CI không cần history submodule: --depth 1 đo được 59s / 83MB.
          # Fallback blobless (~2m14s) cho trường hợp SHA ghim không nằm ở đỉnh branch nên shallow fetch từ chối.
          SM_FAST="--init --recursive --jobs 4 --depth 1"
          SM_SLOW="--init --recursive --jobs 4 --filter=blob:none"
          if [ -n "${GH_PAT:-}" ]; then
            AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')
            echo "::add-mask::$AUTH"
            # extraheader (như actions/checkout) + tắt credential.helper của box; -c propagate xuống submodule clone
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" -c credential.helper= submodule update $SM_FAST \
              || { echo "::warning::shallow submodule thất bại -> fallback blobless"; \
                   git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" -c credential.helper= submodule update $SM_SLOW; }
          else
            git submodule update $SM_FAST \
              || { echo "::warning::shallow submodule thất bại -> fallback blobless"; git submodule update $SM_SLOW; }
          fi
      - id: meta
        run: |
          BR="${GITHUB_REF_NAME//\//-}"
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "tag=${BR}-${SHA}" >> "$GITHUB_OUTPUT"
      - name: Prepare build-time .env (self-hosted disk)
        if: ${{ inputs.env_file_src != '' }}
        run: |
          if sudo -n cp "${{ inputs.env_file_src }}" .env 2>/dev/null; then
            sudo -n chown "$(id -u):$(id -g)" .env 2>/dev/null || true   # .env phải runner-owned, tránh root-owned làm hỏng checkout lần sau
          else
            cp "${{ inputs.env_file_src }}" .env
          fi
      - name: Docker Hub login (best-effort; runner may already be logged in)
        run: |
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME || 'techainer1t' }}" --password-stdin \
            || echo "login skipped/failed -> relying on ambient docker auth"
      - name: Build & push
        run: |
          set -euo pipefail
          ARGS=()
          [ -n "${{ inputs.build_env }}" ] && ARGS+=(--build-arg "ENV=${{ inputs.build_env }}")
          [ -f .env ] && ARGS+=(--secret "id=env_file,src=.env")
          # cache-bust theo NỘI DUNG env: chống Docker tái dùng layer build của env khác (staging↔prod bleed).
          # Dockerfile phải có `ARG ENV_HASH` trước RUN build thì mới ăn.
          [ -f .env ] && ARGS+=(--build-arg "ENV_HASH=$(sha256sum .env | cut -d' ' -f1)")
          docker build "${ARGS[@]}" -t "${{ inputs.image }}:${{ steps.meta.outputs.tag }}" -f "${{ inputs.dockerfile }}" "${{ inputs.context }}"
          docker push "${{ inputs.image }}:${{ steps.meta.outputs.tag }}"
      - name: Cleanup
        if: always()
        run: |
          sudo -n rm -f .env 2>/dev/null || rm -f .env
          docker rmi "${{ inputs.image }}:${{ steps.meta.outputs.tag }}" || true
